[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-spec-kg"
version = "0.1.0"
description = "Traceable knowledge graph construction and completion for Chinese ecological assessment standards."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EcoSpec-KG contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "pdfplumber>=0.11,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
ui = ["gradio>=5.0,<7"]
graph = ["networkx>=3.3,<4", "lancedb>=0.17,<1"]
ml = [
  "torch>=2.3",
  "transformers>=4.51.0",
  "peft>=0.12",
  "accelerate>=0.33",
  "datasets>=2.20",
  "sentence-transformers>=3.0",
]
qwen35 = ["ms-swift"]
ms-graphrag = ["graphrag==3.1.0", "pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8.2", "pytest-cov>=5"]
all = [
  "gradio>=5.0,<7",
  "networkx>=3.3,<4",
  "lancedb>=0.17,<1",
  "torch>=2.3",
  "transformers>=4.51.0",
  "peft>=0.12",
  "accelerate>=0.33",
  "datasets>=2.20",
  "sentence-transformers>=3.0",
  "graphrag==3.1.0",
  "pandas>=2.2",
  "pyarrow>=16",
]

[project.scripts]
eco-spec-kg = "ecospec_kg.cli:main"
eco-spec-kg-v2 = "ecospec_kg.cli_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
